<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enchant & Draft - Signup</title>
  <link href="https://fonts.googleapis.com/css2?family=Metamorphous&display=swap" rel="stylesheet">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="styles-signup.css" >
  <script defer src="./index.js"></script>
</head>

<body>
<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

<div class="container">
  <header>
    <img src="images/logo-color-2.png" height="121" width="700"/>
  </header>
  <nav class="nav">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="#about">About Us</a></li>
      <li><a href="#cart">Shopping Cart</a></li>
      <li><a href="#products">Products</a></li>
      <li><a href="signup.html" class='current'>Login & Signup</a></li>
      <li><a href="#contact">Contact Us</a></li>
    </ul>
  </nav>
  <section class="main">
    <div class="bg-white">
      <h3 class="text-center pt-3">Signup form</h3>
      <!-- Form start -->
      <form id="form" action="#">
        <div class="input-group mb-3 p-3">
          <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
          <input id="username" type="text" class="form-control" placeholder="Username">
          <div class="error"></div>
        </div>
        <div class="input-group mb-3 p-3">
          <span class="input-group-text"><i class="bi bi-at"></i></span>
          <input id="email" type="email" class="form-control" placeholder="Email">
          <div class="error"></div>
        </div>
        <div class="input-group mb-3 p-3">
          <span class="input-group-text"><i class="bi bi-asterisk"></i></span>
          <input id="password" type="password" class="form-control" placeholder="Password">
          <div class="error"></div>
        </div>
        <div class="input-group mb-3 p-3">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input id="password2" type="password" class="form-control" placeholder="Confirm password">
          <div class="error"></div>
        </div>
        <div class="d-grid gap-2 col-6 mx-auto mb-3">
          <button type="submit" class="btn btn-success">Signup now!</button>
        </div>
        <p id="thank-you-message" style="display:none;">Thank you for joining us!</p>
      </form>
      <!-- Form end -->

      <!-- JSON form data -->
      <div id="json-output" style="display:none; margin-top: 20px;">
        <h4>Submitted data (JSON):</h4>
        <pre id="json-data"></pre>
      </div>

    </div>

  </section>

  <footer>
    <span><a href="#terms">Terms of Use</a></span>
    &nbsp;&nbsp;<span><a href="#cookie">Cookie and Privacy Policy</a></span>
    &nbsp;&nbsp;<span><a href="#copyright">Copyright</a></span>
  </footer>

</div>
</body>
</html>
